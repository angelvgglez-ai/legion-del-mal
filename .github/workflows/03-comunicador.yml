# This is a basic workflow to help you get started with Actions

name: Comunicador de la Legion

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Que villano envia el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Brainiac
          - Darkseid
          - Joker


jobs:
 
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

