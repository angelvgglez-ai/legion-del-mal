name: Comunicador de la Legion

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Que villano envia el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Brainiac
          - Darkseid
          - Joker
      mensaje:
        description: 'Mensaje para el consejo'
        required: true
        default: 'La mision fue un exito'

      prioridad:
        description: 'Nivel de prioridad'
        required: true
        type: choice
        options:
          - Normal
          - Alta
          - Critica


jobs:
 
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Inmprimir inputs
        run: |
          echo "Inputs"
          echo ""
          echo "Villano: ${{ inputs.villano }}"
          echo "Nivel: ${{ inputs.prioridad }}"
          echo "Mensaje: ${{ inputs.mensaje }}"


