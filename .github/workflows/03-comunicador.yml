name: Comunicador de la Legion

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Que villano envia el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Brainiac
          - Darkseid
          - Joker
      mensaje:
        description: 'Mensaje para el consejo'
        required: true
        default: 'La mision fue un exito'

      prioridad:
        description: 'Nivel de prioridad'
        required: true
        type: choice
        options:
          - Normal
          - Alta
          - Critica


jobs:
 
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:

      - name: instalar el transmisor de la Legion
        run: sudo apt-get install -y cowsay


      - name: Inmprimir inputs
        run: |
          echo "================================"
          echo "     Transmisor interceptada"
          echo "================================"
          echo ""
          echo "De: ${{ inputs.villano }}"
          echo ""
          echo "Fecha: $(date)"
          echo "Mensaje: $(date -u +"%d/%m/%Y - %H:%M:%S UTC")"
          echo "---------Mensaje---------"
          cowsay -f eyes "${{ inputs.mensaje }}"
          echo ""
          echo "---------${{ inputs.villano }}---------"
          echo "Fin de la mision..."


