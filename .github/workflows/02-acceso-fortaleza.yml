name: Acceso a la Fortaleza Prohibida

on: push

jobs:
    acceso-a-la-base:
        runs-on: ubuntu-latest

        steps:
            - name: El Agente llega a la Fortaleza
              run: | 
                echo "Agente ${{ github.actor }} llega a la Fortaleza Prohibida"
                echo ""
                echo "Buscar los archivos de la Legion:"
                ls -la
                echo ""
                echo ":cross: pero que paso? no hay nada"

            - name: 'Brainiac desbloquea la boveda'
              uses: actions/checkout@v4

            - name: 'Ahora sí, vamos a ver los planes'
              run: |
                echo "Buscar los archivos de la Legion:"
                ls -la
                echo "Funciona!!!"
                echo ""
                echo "Planes:"
                ls planes/
                echo "Villanos:"
                ls miembros/
                echo "Inteligencia:"
                ls inteligencia/
                ls perdedores/
